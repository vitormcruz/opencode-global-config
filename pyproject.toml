[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-config"
version = "0.1.0"
description = "Configuracoes globais do OpenCode e do GitHub Copilot CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
opencode-config-check = "opencode_config:main"
opencode-doc-extract = "opencode_config.cli.doc_extract:main"
opencode-md-export = "opencode_config.cli.md_export:main"
opencode-svgtoimage = "opencode_config.cli.svgtoimage:main"
opencode-browser-test = "opencode_config.cli.browser_test:main"
opencode-adapter = "opencode_config.adapters.opencode:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: testes unitarios sem dependencias externas",
    "tools: testes que requerem ferramentas instaladas",
    "opencode: testes de integracao do OpenCode",
    "copilot: testes de integracao do Copilot CLI",
]
