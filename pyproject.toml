[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-config"
version = "0.1.0"
description = "Configuracoes globais do OpenCode e do GitHub Copilot CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
opencode-config-check = "opencode_config:main"
opencode-doc-extract = "opencode_config.cli.doc_extract:main"
opencode-md-export = "opencode_config.cli.md_export:main"
opencode-svgtoimage = "opencode_config.cli.svgtoimage:main"
opencode-browser-test = "opencode_config.cli.browser_test:main"
opencode-skills = "opencode_config.cli.skills_sync:main"
opencode-scaffold-mapa = "opencode_config.cli.scaffold_mapa:main"
opencode-bootstrap = "opencode_config.bootstrap.main:main"
opencode-adapter = "opencode_config.adapters.opencode:main"
opencode-copilot-adapter = "opencode_config.adapters.copilot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: testes unitarios sem premissas externas",
    "integration: testes com premissas externas (ferramenta no PATH, binario de harness, capacidade do SO)",
    "agent_eval: avaliacao de agente com modelo local llama-server+Qwen",
    "agent_eval_context: contexto minimo de um teste de avaliacao de agente",
    "all: atalho de selecao traduzido pelo conftest para unit or integration (nao usar como decorator)",
]
