<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect x="20" y="20" width="880" height="430" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>

    <g filter="url(#shadow)">
        <rect x="280" y="48" width="360" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
        <text x="460" y="73" font-size="17" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Diretrizes e Regras</text>
        <text x="460" y="94" font-size="15" fill="#1e3a8a" text-anchor="middle">de Produto</text>
    </g>

    <path d="M 460 106 L 460 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
        <rect x="70" y="165" width="250" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
        <text x="195" y="192" font-size="15" fill="#92400e" font-weight="bold" text-anchor="middle">Especificação</text>
        <text x="195" y="213" font-size="15" fill="#92400e" font-weight="bold" text-anchor="middle">do Produto</text>
        <text x="195" y="237" font-size="12" fill="#92400e" text-anchor="middle">escopo, elementos e links</text>
    </g>

    <g filter="url(#shadow)">
        <rect x="335" y="165" width="250" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
        <text x="460" y="192" font-size="15" fill="#92400e" font-weight="bold" text-anchor="middle">Testes por</text>
        <text x="460" y="213" font-size="15" fill="#92400e" font-weight="bold" text-anchor="middle">Especialidade</text>
        <text x="460" y="237" font-size="12" fill="#92400e" text-anchor="middle">arquivo próprio referenciado</text>
    </g>

    <g filter="url(#shadow)">
        <rect x="600" y="165" width="250" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
        <text x="725" y="192" font-size="15" fill="#92400e" font-weight="bold" text-anchor="middle">Instruções por</text>
        <text x="725" y="213" font-size="15" fill="#92400e" font-weight="bold" text-anchor="middle">Agente</text>
        <text x="725" y="237" font-size="12" fill="#92400e" text-anchor="middle">inline no AGENTS.md</text>
    </g>

    <path d="M 460 145 L 195 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 460 145 L 460 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 460 145 L 725 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M 195 257 L 195 315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
        <rect x="75" y="330" width="240" height="68" rx="10" fill="#ffffff" stroke="#94a3b8"/>
        <text x="195" y="357" font-size="13" fill="#334155" font-weight="bold" text-anchor="middle">Especificações subjacentes</text>
        <text x="195" y="378" font-size="12" fill="#475569" text-anchor="middle">links orientados e validados</text>
    </g>

    <path d="M 460 257 L 460 315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
        <rect x="340" y="330" width="240" height="68" rx="10" fill="#ffffff" stroke="#94a3b8"/>
        <text x="460" y="357" font-size="13" fill="#334155" font-weight="bold" text-anchor="middle">Suítes e agregador</text>
        <text x="460" y="378" font-size="12" fill="#475569" text-anchor="middle">especificação de testes</text>
    </g>

    <path d="M 725 257 L 725 315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
        <rect x="605" y="330" width="240" height="68" rx="10" fill="#ffffff" stroke="#94a3b8"/>
        <text x="725" y="357" font-size="13" fill="#334155" font-weight="bold" text-anchor="middle">Regras do repositório</text>
        <text x="725" y="378" font-size="12" fill="#475569" text-anchor="middle">instruções específicas por agente</text>
    </g>
