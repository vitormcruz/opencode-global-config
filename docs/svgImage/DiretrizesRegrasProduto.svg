<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ================= CONTAINER PRINCIPAL (DIRETRIZES E REGRAS) ================= -->
  <ellipse cx="600" cy="470" rx="570" ry="440" fill="#f8fafc" stroke="#2563eb" stroke-width="3" filter="url(#glow)"/>

  <!-- Título Superior -->
  <g filter="url(#shadow)">
    <rect x="375" y="25" width="450" height="54" rx="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="600" y="59" font-size="21" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Diretrizes e Regras de Produto</text>
  </g>

  <!-- ================= 1. ESPECIFICAÇÃO DO PRODUTO (TOPO ESQUERDA) ================= -->
  <!-- Spokes -->
  <!-- Histórias de Usuário (Top-Left Externo) -->
  <line x1="365" y1="220" x2="345" y2="176" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="250" y="140" width="190" height="36" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="268" y="163" font-size="16">📝</text>
    <text x="292" y="163" font-size="13" fill="#0369a1" font-weight="bold">Histórias de Usuário</text>
  </g>

  <!-- Modelo de Dados ER (Left Externo) -->
  <line x1="326" y1="280" x2="305" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="120" y="262" width="185" height="36" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="138" y="285" font-size="16">🗄️</text>
    <text x="162" y="285" font-size="13" fill="#0369a1" font-weight="bold">Modelo de Dados ER</text>
  </g>

  <!-- Regras de Negócio (Subido na Diagonal para a Direita) -->
  <line x1="452" y1="225" x2="495" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="495" y="165" width="175" height="36" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="513" y="188" font-size="16">📋</text>
    <text x="537" y="188" font-size="13" fill="#0369a1" font-weight="bold">Regras de Negócio</text>
  </g>

  <!-- Critérios de Aceite (Puxado mais para a Esquerda) -->
  <line x1="405" y1="354" x2="425" y2="415" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="350" y="415" width="185" height="36" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="368" y="438" font-size="16">✅</text>
    <text x="392" y="438" font-size="13" fill="#0369a1" font-weight="bold">Critérios de Aceite</text>
  </g>

  <!-- Círculo Central 1 -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="280" r="74" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
    <circle cx="400" cy="280" r="66" fill="#f0f9ff"/>
    <text x="400" y="256" font-size="26" text-anchor="middle">📄</text>
    <text x="400" y="284" font-size="14.5" fill="#0369a1" font-weight="bold" text-anchor="middle">Especificação</text>
    <text x="400" y="303" font-size="14.5" fill="#0369a1" font-weight="bold" text-anchor="middle">do Produto</text>
  </g>


  <!-- ================= 2. TESTES POR ESPECIALIDADE (TOPO DIREITA) ================= -->
  <!-- Spokes -->
  <!-- SonarQube / Lint (Top-Right Externo) -->
  <line x1="835" y1="220" x2="855" y2="176" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="760" y="140" width="190" height="36" rx="18" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="778" y="163" font-size="16">🔍</text>
    <text x="802" y="163" font-size="13" fill="#047857" font-weight="bold">SonarQube / Lint</text>
  </g>

  <!-- K6 Performance (Right Externo) -->
  <line x1="874" y1="280" x2="895" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="895" y="262" width="185" height="36" rx="18" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="913" y="285" font-size="16">⚡</text>
    <text x="937" y="285" font-size="13" fill="#047857" font-weight="bold">K6 (Performance)</text>
  </g>

  <!-- Semgrep / SAST (Centro) -->
  <line x1="735" y1="285" x2="690" y2="305" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="525" y="290" width="165" height="36" rx="18" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="542" y="313" font-size="16">🛡️</text>
    <text x="566" y="313" font-size="13" fill="#047857" font-weight="bold">Semgrep (SAST)</text>
  </g>

  <!-- Pytest / JUnit (Puxado mais para a Direita) -->
  <line x1="790" y1="354" x2="770" y2="415" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="680" y="415" width="195" height="36" rx="18" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="698" y="438" font-size="16">🧪</text>
    <text x="722" y="438" font-size="13" fill="#047857" font-weight="bold">Pytest / JUnit (DONE)</text>
  </g>

  <!-- Círculo Central 2 -->
  <g filter="url(#shadow)">
    <circle cx="800" cy="280" r="74" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <circle cx="800" cy="280" r="66" fill="#f0fdf4"/>
    <text x="800" y="256" font-size="26" text-anchor="middle">🧪</text>
    <text x="800" y="284" font-size="14.5" fill="#047857" font-weight="bold" text-anchor="middle">Testes por</text>
    <text x="800" y="303" font-size="14.5" fill="#047857" font-weight="bold" text-anchor="middle">Especialidade</text>
  </g>


  <!-- ================= 3. INSTRUÇÕES POR AGENTE (EMBAIXO CENTRO) ================= -->
  <!-- Spokes -->
  <!-- sec: ao fim da tarefa (Left) -->
  <line x1="535" y1="595" x2="430" y2="576" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="230" y="550" width="200" height="52" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="330" y="572" font-size="12" fill="#b45309" font-weight="bold" text-anchor="middle">🔍 sec: ao fim da tarefa,</text>
    <text x="330" y="590" font-size="12" fill="#b45309" font-weight="bold" text-anchor="middle">rodar SAST</text>
  </g>

  <!-- sec: na revisão (Right) -->
  <line x1="665" y1="595" x2="770" y2="576" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="770" y="550" width="220" height="52" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="880" y="572" font-size="11.5" fill="#b45309" font-weight="bold" text-anchor="middle">⚠️ sec: na revisão,</text>
    <text x="880" y="590" font-size="11.5" fill="#b45309" font-weight="bold" text-anchor="middle">agrupar violações por criticidade</text>
  </g>

  <!-- eng: após alterações (Bottom-Left) -->
  <line x1="550" y1="670" x2="435" y2="715" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="310" y="715" width="210" height="52" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="415" y="737" font-size="12" fill="#b45309" font-weight="bold" text-anchor="middle">💻 eng: após alterações,</text>
    <text x="415" y="755" font-size="12" fill="#b45309" font-weight="bold" text-anchor="middle">rodar regressão</text>
  </g>

  <!-- qa: na validação (Bottom-Right) -->
  <line x1="650" y1="670" x2="765" y2="715" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="680" y="715" width="210" height="52" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="785" y="737" font-size="12" fill="#b45309" font-weight="bold" text-anchor="middle">🧪 qa: na validação,</text>
    <text x="785" y="755" font-size="12" fill="#b45309" font-weight="bold" text-anchor="middle">rodar testes de aceite</text>
  </g>

  <!-- Círculo Central 3 -->
  <g filter="url(#shadow)">
    <circle cx="600" cy="620" r="74" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <circle cx="600" cy="620" r="66" fill="#fefce8"/>
    <text x="600" y="596" font-size="26" text-anchor="middle">🤖</text>
    <text x="600" y="624" font-size="14.5" fill="#b45309" font-weight="bold" text-anchor="middle">Instruções</text>
    <text x="600" y="643" font-size="14.5" fill="#b45309" font-weight="bold" text-anchor="middle">por Agente</text>
  </g>
</svg>
