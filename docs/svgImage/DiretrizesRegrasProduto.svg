<svg xmlns="http://www.w3.org/2000/svg" width="960" height="930" viewBox="0 0 960 930" role="img" aria-labelledby="title desc">
  <title id="title">Diretrizes e Regras de Produto: referências e conteúdo</title>
  <desc id="desc">Duas setas saem do cabeçalho do AGENTS.md e apontam para a Especificação do Produto e os Testes por Especialidade. As Instruções por Agente ficam em uma área própria dentro do contorno do AGENTS.md e não originam essas referências. Os três grupos incluem exemplos ilustrativos, não prescrições de ferramentas ou instruções universais.</desc>
