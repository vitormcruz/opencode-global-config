<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="100%" height="100%" style="font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif; text-rendering: geometricPrecision;">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Fundo branco -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ================= CONTAINER PRINCIPAL (DIRETRIZES E REGRAS) ================= -->
  <ellipse cx="600" cy="470" rx="570" ry="440" fill="#f8fafc" stroke="#2563eb" stroke-width="3" filter="url(#glow)"/>

  <!-- Título Superior -->
  <g filter="url(#shadow)">
    <rect x="375" y="25" width="450" height="54" rx="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="600" y="59" font-size="21" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Diretrizes e Regras de Produto</text>
  </g>

  <!-- ================= 1. ESPECIFICAÇÃO DO PRODUTO (TOPO ESQUERDA) ================= -->
  <!-- Spokes -->
  <!-- Histórias de Usuário (Top-Left Externo) -->
  <line x1="365" y1="220" x2="335" y2="176" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="230" y="136" width="210" height="40" rx="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="248" y="161" font-size="18">📝</text>
    <text x="276" y="161" font-size="15" fill="#0369a1" font-weight="bold">Histórias de Usuário</text>
  </g>

  <!-- Modelo de Dados ER (Left Externo) -->
  <line x1="326" y1="280" x2="295" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="90" y="260" width="205" height="40" rx="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="108" y="285" font-size="18">🗄️</text>
    <text x="136" y="285" font-size="15" fill="#0369a1" font-weight="bold">Modelo de Dados ER</text>
  </g>

  <!-- Regras de Negócio (Subido na Diagonal para a Direita) -->
  <line x1="452" y1="225" x2="495" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="495" y="162" width="195" height="40" rx="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="513" y="187" font-size="18">📋</text>
    <text x="541" y="187" font-size="15" fill="#0369a1" font-weight="bold">Regras de Negócio</text>
  </g>

  <!-- Critérios de Aceite (Puxado mais para a Esquerda) -->
  <line x1="405" y1="354" x2="425" y2="415" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="330" y="415" width="205" height="40" rx="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="348" y="440" font-size="18">✅</text>
    <text x="376" y="440" font-size="15" fill="#0369a1" font-weight="bold">Critérios de Aceite</text>
  </g>

  <!-- Círculo Central 1 -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="280" r="76" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
    <circle cx="400" cy="280" r="68" fill="#f0f9ff"/>
    <text x="400" y="254" font-size="28" text-anchor="middle">📄</text>
    <text x="400" y="283" font-size="16" fill="#0369a1" font-weight="bold" text-anchor="middle">Especificação</text>
    <text x="400" y="304" font-size="16" fill="#0369a1" font-weight="bold" text-anchor="middle">do Produto</text>
  </g>


  <!-- ================= 2. TESTES POR ESPECIALIDADE (TOPO DIREITA) ================= -->
  <!-- Spokes -->
  <!-- SonarQube / Lint (Top-Right Externo) -->
  <line x1="835" y1="220" x2="865" y2="176" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="760" y="136" width="205" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <text x="778" y="161" font-size="18">🔍</text>
    <text x="806" y="161" font-size="15" fill="#047857" font-weight="bold">SonarQube / Lint</text>
  </g>

  <!-- K6 Performance (Right Externo) -->
  <line x1="874" y1="280" x2="905" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="905" y="260" width="195" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <text x="923" y="285" font-size="18">⚡</text>
    <text x="951" y="285" font-size="15" fill="#047857" font-weight="bold">K6 (Performance)</text>
  </g>

  <!-- Semgrep / SAST (Centro) -->
  <line x1="735" y1="285" x2="700" y2="305" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="520" y="288" width="180" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <text x="537" y="313" font-size="18">🛡️</text>
    <text x="565" y="313" font-size="15" fill="#047857" font-weight="bold">Semgrep (SAST)</text>
  </g>

  <!-- Pytest / JUnit (Puxado mais para a Direita) -->
  <line x1="790" y1="354" x2="770" y2="415" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="675" y="415" width="225" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <text x="693" y="440" font-size="18">🧪</text>
    <text x="721" y="440" font-size="15" fill="#047857" font-weight="bold">Pytest / JUnit (DONE)</text>
  </g>

  <!-- Círculo Central 2 -->
  <g filter="url(#shadow)">
    <circle cx="800" cy="280" r="76" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <circle cx="800" cy="280" r="68" fill="#f0fdf4"/>
    <text x="800" y="254" font-size="28" text-anchor="middle">🧪</text>
    <text x="800" y="283" font-size="16" fill="#047857" font-weight="bold" text-anchor="middle">Testes por</text>
    <text x="800" y="304" font-size="16" fill="#047857" font-weight="bold" text-anchor="middle">Especialidade</text>
  </g>


  <!-- ================= 3. INSTRUÇÕES POR AGENTE (EMBAIXO CENTRO) ================= -->
  <!-- Spokes -->
  <!-- sec: ao fim da tarefa (Left) -->
  <line x1="535" y1="595" x2="435" y2="574" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="210" y="546" width="225" height="56" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <text x="322" y="569" font-size="13.5" fill="#b45309" font-weight="bold" text-anchor="middle">🔍 sec: ao fim da tarefa,</text>
    <text x="322" y="589" font-size="13.5" fill="#b45309" font-weight="bold" text-anchor="middle">rodar SAST</text>
  </g>

  <!-- sec: na revisão (Right) -->
  <line x1="665" y1="595" x2="765" y2="574" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="765" y="546" width="255" height="56" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <text x="892" y="569" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">⚠️ sec: na revisão,</text>
    <text x="892" y="589" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">agrupar violações por criticidade</text>
  </g>

  <!-- eng: após alterações (Bottom-Left) -->
  <line x1="550" y1="670" x2="435" y2="715" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="295" y="715" width="230" height="56" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <text x="410" y="738" font-size="13.5" fill="#b45309" font-weight="bold" text-anchor="middle">💻 eng: após alterações,</text>
    <text x="410" y="758" font-size="13.5" fill="#b45309" font-weight="bold" text-anchor="middle">rodar regressão</text>
  </g>

  <!-- qa: na validação (Bottom-Right) -->
  <line x1="650" y1="670" x2="765" y2="715" stroke="#94a3b8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="675" y="715" width="230" height="56" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <text x="790" y="738" font-size="13.5" fill="#b45309" font-weight="bold" text-anchor="middle">🧪 qa: na validação,</text>
    <text x="790" y="758" font-size="13.5" fill="#b45309" font-weight="bold" text-anchor="middle">rodar testes de aceite</text>
  </g>

  <!-- Círculo Central 3 -->
  <g filter="url(#shadow)">
    <circle cx="600" cy="620" r="76" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <circle cx="600" cy="620" r="68" fill="#fefce8"/>
    <text x="600" y="594" font-size="28" text-anchor="middle">🤖</text>
    <text x="600" y="623" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">Instruções</text>
    <text x="600" y="644" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">por Agente</text>
  </g>
</svg>
