<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%" style="font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif; text-rendering: geometricPrecision;">
  <defs>
    <!-- Marcadores de seta de ida (aumentados para alta visibilidade) -->
    <marker id="arrow-blue-lg" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-red-lg" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#dc2626" />
    </marker>

    <!-- Marcador de seta de retorno (amarelo ouro vívido e aumentado) -->
    <marker id="arrow-yellow-lg" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Fundo branco -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ================= SETAS DE IDA (CONTÍNUAS) ================= -->
  <!-- 1. Planejamento -> Construção (Curva externa direita) -->
  <path d="M 565 140 Q 770 240 728 370" fill="none" stroke="#0284c7" stroke-width="3.2" marker-end="url(#arrow-blue-lg)"/>

  <!-- 2. Construção -> Testes (Curva horizontal inferior) -->
  <path d="M 600 455 Q 450 520 310 454" fill="none" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrow-red-lg)"/>

  <!-- ================= SETAS DE RETORNO (PONTILHADAS / AMARELAS) ================= -->
  <!-- 3. Construção -> Planejamento (Retorno de dúvidas/replanejamento) -->
  <path d="M 625 375 Q 635 260 514 182" fill="none" stroke="#f59e0b" stroke-width="3.2" stroke-dasharray="7,5" marker-end="url(#arrow-yellow-lg)"/>

  <!-- 4. Testes -> Construção (Retorno de refatoração / TDD) -->
  <path d="M 320 395 Q 450 335 564 395" fill="none" stroke="#f59e0b" stroke-width="3.2" stroke-dasharray="7,5" marker-end="url(#arrow-yellow-lg)"/>

  <!-- 5. Testes -> Planejamento (Retorno de mudança de planejamento) -->
  <path d="M 190 375 Q 185 230 386 182" fill="none" stroke="#f59e0b" stroke-width="3.2" stroke-dasharray="7,5" marker-end="url(#arrow-yellow-lg)"/>

  <!-- ================= MICRO-LOOPS DE REVISÃO INTERNA ================= -->
  <!-- Auto-loop Planejamento (Topo) -->
  <path d="M 530 95 C 578 35, 475 12, 440 80" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrow-blue-lg)"/>
  <rect x="480" y="20" width="116" height="28" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="538" y="39" font-size="13.5" fill="#0369a1" font-weight="bold" text-anchor="middle">🔍 Revisão</text>

  <!-- Auto-loop Construção (Lateral Direita com folga exata da borda) -->
  <path d="M 770 385 C 858 368, 868 445, 802 443" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrow-red-lg)"/>
  <rect x="806" y="396" width="116" height="28" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="864" y="415" font-size="13.5" fill="#991b1b" font-weight="bold" text-anchor="middle">🔍 Revisão</text>

  <!-- ================= NÓS DO CICLO ================= -->
  <!-- Planejamento (Azul com tipografia ampliada) -->
  <ellipse cx="450" cy="130" rx="130" ry="50" fill="#f0f9ff" stroke="#0284c7" stroke-width="3.5"/>
  <text x="450" y="122" font-size="24" text-anchor="middle">📋</text>
  <text x="450" y="150" font-size="19" fill="#0369a1" font-weight="bold" text-anchor="middle">Planejamento</text>

  <!-- Testes (Verde com tipografia ampliada) -->
  <ellipse cx="220" cy="420" rx="125" ry="50" fill="#f0fdf4" stroke="#059669" stroke-width="3.5"/>
  <text x="220" y="412" font-size="24" text-anchor="middle">🧪</text>
  <text x="220" y="440" font-size="19" fill="#047857" font-weight="bold" text-anchor="middle">Testes</text>

  <!-- Construção (Vermelho com tipografia ampliada) -->
  <ellipse cx="680" cy="420" rx="125" ry="50" fill="#fef2f2" stroke="#dc2626" stroke-width="3.5"/>
  <text x="680" y="412" font-size="24" text-anchor="middle">🛠️</text>
  <text x="680" y="440" font-size="19" fill="#991b1b" font-weight="bold" text-anchor="middle">Construção</text>
</svg>