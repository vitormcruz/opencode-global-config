<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="100%" height="100%" style="font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif; text-rendering: geometricPrecision;">
  <defs>
    <filter id="shadow-swimlane" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
    <marker id="arr-blue-swimlane" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arr-red-swimlane" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arr-amber-swimlane" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-gray-swimlane" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Fundo branco -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Título -->
  <text x="600" y="36" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="middle">Fluxo Detalhado — Matriz de Responsabilidades (Swimlanes)</text>
  <text x="600" y="56" font-size="12.5" fill="#64748b" text-anchor="middle">Visão em raias: Ações Humanas, Orquestração Devflow e Atuação dos Especialistas</text>

  <!-- ================= RAIAS DE FUNDO ================= -->
  <!-- Raia 1: Humano -->
  <rect x="30" y="75" width="1140" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="30" y="75" width="150" height="135" rx="8" fill="#f1f5f9"/>
  <rect x="170" y="75" width="10" height="135" fill="#f1f5f9"/>
  <text x="105" y="136" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">👤 Humano</text>
  <text x="105" y="156" font-size="10.5" fill="#64748b" text-anchor="middle">(Decisões &amp; Gates)</text>

  <!-- Raia 2: Devflow / Orquestrador -->
  <rect x="30" y="225" width="1140" height="215" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <rect x="30" y="225" width="150" height="215" rx="8" fill="#e0f2fe"/>
  <rect x="170" y="225" width="10" height="215" fill="#e0f2fe"/>
  <text x="105" y="325" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">⚡ Devflow</text>
  <text x="105" y="345" font-size="10.5" fill="#0284c7" text-anchor="middle">(Orquestração)</text>

  <!-- Raia 3: Agentes Especialistas -->
  <rect x="30" y="455" width="1140" height="205" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="455" width="150" height="205" rx="8" fill="#f8fafc"/>
  <rect x="170" y="455" width="10" height="205" fill="#f8fafc"/>
  <text x="105" y="550" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">🤖 Agentes</text>
  <text x="105" y="570" font-size="10.5" fill="#475569" text-anchor="middle">(Execução &amp; Revisão)</text>

  <!-- ================= ETAPA 1: INICIALIZAÇÃO ================= -->
  <!-- Humano: Solicitação -->
  <g transform="translate(200, 90)" filter="url(#shadow-swimlane)">
    <rect width="205" height="85" rx="8" fill="#ffffff" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>
    <text x="102" y="34" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Define objetivo &amp; escopo</text>
    <text x="102" y="54" font-size="10.5" fill="#475569" text-anchor="middle">Inicia a elicitação</text>
    <text x="102" y="70" font-size="9.5" fill="#64748b" text-anchor="middle">(Solicitação)</text>
  </g>

  <!-- Devflow: Inicialização -->
  <g transform="translate(200, 260)" filter="url(#shadow-swimlane)">
    <rect width="205" height="85" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="102" y="32" font-size="13.5" font-weight="bold" fill="#0369a1" text-anchor="middle">1. Inicialização</text>
    <text x="102" y="54" font-size="10.5" fill="#475569" text-anchor="middle">Elicitação de requisitos</text>
    <text x="102" y="70" font-size="10" fill="#64748b" text-anchor="middle">Criação do plano base</text>
  </g>

  <!-- Agentes: Curador Produto -->
  <g transform="translate(200, 490)" filter="url(#shadow-swimlane)">
    <rect width="205" height="145" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="102" y="30" font-size="12.5" font-weight="bold" fill="#1e293b" text-anchor="middle">curador-produto</text>
    <text x="102" y="60" font-size="10.5" fill="#475569" text-anchor="middle">Consulta diretrizes</text>
    <text x="102" y="82" font-size="10.5" fill="#475569" text-anchor="middle">Delimita o escopo</text>
    <text x="102" y="108" font-size="10.5" fill="#64748b" text-anchor="middle">Estrutura planejamento</text>
  </g>

  <!-- Conexões Etapa 1 -->
  <path d="M 302 175 L 302 255" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue-swimlane)"/>
  <path d="M 302 345 L 302 485" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue-swimlane)"/>

  <!-- ================= ETAPA 2: PLANEJAMENTO ================= -->
  <!-- Humano: Valida e autoriza o plano (Gate de Aprovação) -->
  <g transform="translate(450, 90)" filter="url(#shadow-swimlane)">
    <rect width="220" height="85" rx="8" fill="#ffffff" stroke="#0284c7" stroke-dasharray="4,3" stroke-width="1.8"/>
    <text x="110" y="38" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Valida e autoriza o plano</text>
    <text x="110" y="62" font-size="10.5" fill="#0284c7" text-anchor="middle">(Gate de Aprovação)</text>
  </g>

  <!-- Devflow: Planejamento -->
  <g transform="translate(450, 260)" filter="url(#shadow-swimlane)">
    <rect width="220" height="85" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="110" y="32" font-size="13.5" font-weight="bold" fill="#0369a1" text-anchor="middle">2. Planejamento</text>
    <text x="110" y="54" font-size="10.5" fill="#0284c7" text-anchor="middle">Coordena especialistas</text>
    <text x="110" y="70" font-size="10" fill="#64748b" text-anchor="middle">Consolida tarefas &amp; TDD</text>
  </g>

  <!-- Agentes: Especialistas & rev (com auto-loop de revisão aqui nos Agentes!) -->
  <g transform="translate(450, 490)" filter="url(#shadow-swimlane)">
    <rect width="220" height="145" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="110" y="30" font-size="12.5" font-weight="bold" fill="#0369a1" text-anchor="middle">Especialistas &amp; rev</text>
    <text x="110" y="60" font-size="10.5" fill="#0c4a6e" text-anchor="middle">eng-software, front, dba</text>
    <text x="110" y="82" font-size="10.5" fill="#0c4a6e" text-anchor="middle">sec, qa (modelagem &amp; testes)</text>
    <text x="110" y="108" font-size="10.5" font-weight="bold" fill="#0369a1" text-anchor="middle">rev (inspeção do plano)</text>
  </g>

  <!-- Auto-loop de Revisão nos Agentes (Planejamento) -->
  <path d="M 620 490 C 645 455, 535 455, 555 485" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-blue-swimlane)"/>
  <rect x="550" y="450" width="84" height="20" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="592" y="464" font-size="10" fill="#0369a1" font-weight="bold" text-anchor="middle">🔍 Revisão</text>

  <!-- Conexões Etapa 2 -->
  <path d="M 405 302 L 445 302" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue-swimlane)"/>
  <path d="M 490 345 L 490 485" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue-swimlane)"/>
  <!-- Submissão do plano ao Humano (linha vertical limpa sem nada cruzando) -->
  <path d="M 560 260 L 560 180" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue-swimlane)"/>

  <!-- ================= ETAPA 3: CONSTRUÇÃO ================= -->
  <!-- Humano: Autoriza Nova Revisão (Gate de Loop) -->
  <g transform="translate(715, 90)" filter="url(#shadow-swimlane)">
    <rect width="220" height="85" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="4,3" stroke-width="1.8"/>
    <text x="110" y="38" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Autoriza Nova Revisão</text>
    <text x="110" y="62" font-size="10.5" fill="#dc2626" text-anchor="middle">(Gate de Loop)</text>
  </g>

  <!-- Devflow: Construção -->
  <g transform="translate(715, 260)" filter="url(#shadow-swimlane)">
    <rect width="220" height="85" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="110" y="32" font-size="13.5" font-weight="bold" fill="#991b1b" text-anchor="middle">3. Construção</text>
    <text x="110" y="54" font-size="10.5" fill="#dc2626" text-anchor="middle">Coordena execução</text>
    <text x="110" y="70" font-size="10" fill="#64748b" text-anchor="middle">Implementação &amp; TDD</text>
  </g>

  <!-- Agentes: dba, front, eng-software (com auto-loop de revisão aqui nos Agentes!) -->
  <g transform="translate(715, 490)" filter="url(#shadow-swimlane)">
    <rect width="220" height="145" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="110" y="30" font-size="12.5" font-weight="bold" fill="#991b1b" text-anchor="middle">dba, front, eng-software</text>
    <text x="110" y="60" font-size="10.5" fill="#7f1d1d" text-anchor="middle">Implementação via TDD</text>
    <text x="110" y="82" font-size="10.5" fill="#7f1d1d" text-anchor="middle">Migrações, telas e regras</text>
    <text x="110" y="108" font-size="10.5" font-weight="bold" fill="#991b1b" text-anchor="middle">rev (inspeção de código)</text>
  </g>

  <!-- Auto-loop de Revisão nos Agentes (Construção) -->
  <path d="M 885 490 C 910 455, 800 455, 820 485" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-red-swimlane)"/>
  <rect x="815" y="450" width="84" height="20" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="857" y="464" font-size="10" fill="#991b1b" font-weight="bold" text-anchor="middle">🔍 Revisão</text>

  <!-- Conexões Etapa 3 (Sem nenhum cruzamento!) -->
  <!-- 1. Plano aprovado desce suavemente do Humano para Devflow Construção -->
  <path d="M 640 175 C 640 215, 735 215, 735 255" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue-swimlane)"/>
  
  <!-- 2. Devflow Construção sobe para Gate de Loop se re-revisão -->
  <path d="M 805 260 L 805 180" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr-red-swimlane)"/>
  
  <!-- 3. Gate de Loop autoriza e desce para Devflow Construção (perfeitamente paralelo, sem cruzar!) -->
  <path d="M 855 175 L 855 255" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red-swimlane)"/>

  <!-- 4. Devflow dispara para Agentes Construção -->
  <path d="M 755 345 L 755 485" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-blue-swimlane)"/>

  <!-- ================= ETAPA 4: TESTES & FINALIZAÇÃO ================= -->
  <!-- Humano: Valida entrega final (Gate Final) -->
  <g transform="translate(975, 90)" filter="url(#shadow-swimlane)">
    <rect width="195" height="85" rx="8" fill="#ffffff" stroke="#059669" stroke-dasharray="4,3" stroke-width="1.8"/>
    <text x="97" y="34" font-size="12.5" font-weight="bold" fill="#047857" text-anchor="middle">Valida entrega final</text>
    <text x="97" y="52" font-size="11" font-weight="bold" fill="#064e3b" text-anchor="middle">Aprova encerramento</text>
    <text x="97" y="70" font-size="10" fill="#059669" text-anchor="middle">(Gate Final)</text>
  </g>

  <!-- Devflow: Testes & Final -->
  <g transform="translate(975, 260)" filter="url(#shadow-swimlane)">
    <rect width="195" height="85" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="97" y="32" font-size="13.5" font-weight="bold" fill="#047857" text-anchor="middle">4. Testes &amp; Final</text>
    <text x="97" y="54" font-size="10.5" fill="#059669" text-anchor="middle">Coordena testes de produto</text>
    <text x="97" y="70" font-size="10" fill="#64748b" text-anchor="middle">Auditoria documental</text>
  </g>

  <!-- Agentes: qa, sec, curador -->
  <g transform="translate(975, 490)" filter="url(#shadow-swimlane)">
    <rect width="195" height="145" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
    <text x="97" y="30" font-size="12.5" font-weight="bold" fill="#047857" text-anchor="middle">qa, sec, curador</text>
    <text x="97" y="60" font-size="10.5" fill="#064e3b" text-anchor="middle">qa (testes-produto)</text>
    <text x="97" y="82" font-size="10.5" fill="#064e3b" text-anchor="middle">sec (testes segurança)</text>
    <text x="97" y="108" font-size="10.5" font-weight="bold" fill="#047857" text-anchor="middle">curador (auditoria docs)</text>
  </g>

  <!-- Conexões Etapa 4 -->
  <path d="M 935 302 L 970 302" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue-swimlane)"/>
  <path d="M 1072 345 L 1072 485" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-blue-swimlane)"/>
  <path d="M 1072 260 L 1072 180" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-blue-swimlane)"/>

  <!-- ================= LOOPS DE RETORNO (INTERNOS DO DEVFLOW) ================= -->
  <!-- 1. Falha em Testes -> Devflow Construção -->
  <path d="M 1020 345 C 1020 395, 890 395, 890 350" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arr-amber-swimlane)"/>
  <rect x="900" y="383" width="125" height="22" rx="11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="962" y="398" font-size="10" fill="#b45309" font-weight="bold" text-anchor="middle">↩ Falha em Testes</text>

  <!-- 2. Mudança de Plano: Devflow Construção -> Devflow Planejamento -->
  <path d="M 750 345 C 750 420, 630 420, 630 350" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arr-amber-swimlane)"/>
  <rect x="635" y="408" width="140" height="22" rx="11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="705" y="423" font-size="10" fill="#b45309" font-weight="bold" text-anchor="middle">↩ Mudança de Plano</text>
</svg>