<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Mapa iconográfico do framework</title>
  <desc id="desc">A Governança de Produto mantém as Diretrizes e Regras de Produto, que orientam tanto a Ideação quanto o Desenvolvimento. A Ideação, um fluxo independente, prepara o escopo. O Desenvolvimento pode receber esse escopo ou defini-lo na entrada e produz código e especificações.</desc>
  <defs>
    <style>
      svg{fill:#20344c}text{font-family:"Segoe UI",Arial,sans-serif}
      .name{font-size:25px;font-weight:650;text-anchor:middle}
      .edge{font-size:18px;fill:#586b80;text-anchor:middle}
      .icon{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#496780" stroke-width="1.6"/></marker>
    <marker id="guide" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#91a2b7" stroke-width="1.6"/></marker>
    <g id="book" class="icon"><path d="M2 4h7q3 0 3 3v14q0-3-3-3H2ZM22 4h-7q-3 0-3 3v14q0-3 3-3h7Z"/><path d="M5 8h3M5 12h3M16 8h3M16 12h3"/></g>
    <g id="bulb" class="icon"><path d="M8 17c0-4-4-4-4-9a8 8 0 0 1 16 0c0 5-4 5-4 9ZM9 21h6M12 10v7M9 8l3 2 3-2"/><path d="M1 1 3 3M21 3 23 1"/></g>
    <g id="code" class="icon"><rect x="1" y="2" width="22" height="18" rx="3"/><path d="M1 7h22M8 11l-3 3 3 3M16 11l3 3-3 3M13 10l-2 8"/><circle cx="5" cy="4.5" r=".5" fill="currentColor" stroke="none"/><circle cx="8" cy="4.5" r=".5" fill="currentColor" stroke="none"/></g>
    <g id="sheet" class="icon"><path d="M4 1h10l6 6v16H4ZM14 1v6h6M8 11h8M8 15h8M8 19h5"/></g>
  </defs>
  <rect width="960" height="660" fill="#fff"/>

  <path d="M480 134V199" fill="none" stroke="#496780" stroke-width="2" marker-end="url(#flow)"/>
  <text x="530" y="173" class="edge">mantém</text>
  <circle cx="480" cy="82" r="52" fill="#edf3ff"/>
  <use href="#book" transform="translate(454 56) scale(2.16)" color="#315ed4"/>
  <text x="555" y="76" font-size="25" font-weight="650">Governança</text>
  <text x="555" y="108" font-size="25" font-weight="650">de Produto</text>

  <rect x="345" y="210" width="270" height="74" rx="12" fill="#fff7e8" stroke="#dfc99e" stroke-width="1.5"/>
  <use href="#book" transform="translate(362 231) scale(1.35)" color="#95631c"/>
  <text x="415" y="241" font-size="20" font-weight="600" fill="#80551c">Diretrizes e Regras</text>
  <text x="415" y="267" font-size="20" fill="#80551c">de Produto</text>
  <path d="M345 247H102Q80 247 80 269V400Q80 422 100 422" fill="none" stroke="#91a2b7" stroke-width="1.8" marker-end="url(#guide)"/>
  <path d="M615 247H878Q900 247 900 269V400Q900 422 860 422" fill="none" stroke="#91a2b7" stroke-width="1.8" marker-end="url(#guide)"/>
  <text x="207" y="233" class="edge">orientam</text>
  <text x="757" y="233" class="edge">orientam</text>

  <text x="180" y="327" class="name">Ideação</text>
  <circle cx="180" cy="422" r="72" fill="#edf3ff" stroke="#cad9f4" stroke-width="1.5"/>
  <use href="#bulb" transform="translate(150 393) scale(2.5)" color="#315ed4"/>
  <text x="180" y="533" class="edge">Fluxo independente</text>

  <path d="M264 422H417" fill="none" stroke="#496780" stroke-width="2" marker-end="url(#flow)"/>
  <text x="337" y="406" class="edge">prepara</text>
  <use href="#sheet" transform="translate(436 376) scale(3.6)" color="#95631c"/>
  <text x="480" y="504" class="name">Escopo</text>
  <path d="M529 422H696" fill="none" stroke="#496780" stroke-width="2" marker-end="url(#flow)"/>
  <text x="612" y="406" class="edge">entrada</text>

  <text x="780" y="327" class="name">Desenvolvimento</text>
  <circle cx="780" cy="422" r="72" fill="#edf3ff" stroke="#cad9f4" stroke-width="1.5"/>
  <use href="#code" transform="translate(748 394) scale(2.7)" color="#315ed4"/>
  <path d="M780 494V550" fill="none" stroke="#496780" stroke-width="2" marker-end="url(#flow)"/>
  <rect x="649" y="562" width="262" height="74" rx="12" fill="#eef8f3" stroke="#c7e0d3" stroke-width="1.5"/>
  <use href="#sheet" transform="translate(666 581) scale(1.55)" color="#25745e"/>
  <text x="716" y="592" font-size="21" font-weight="600" fill="#24644f">Código e</text>
  <text x="716" y="620" font-size="21" font-weight="600" fill="#24644f">especificações</text>

  <text x="78" y="609" font-size="18" fill="#586b80">O escopo também pode nascer no Desenvolvimento.</text>
</svg>
