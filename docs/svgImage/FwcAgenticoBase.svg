<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%" style="font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif; text-rendering: geometricPrecision;">
    <defs>
        <!-- Marcador de Seta -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
        </filter>
    </defs>

    <!-- Fundo branco -->
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ================= CONEXÕES E SETAS ================= -->
    <!-- Ideação -> Novo Escopo (cria) -->
    <path d="M 180 130 Q 150 180 170 215" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="135" y="165" width="38" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="154" y="179" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">cria</text>

    <!-- Governança -> Diretrizes (define) -->
    <path d="M 580 125 Q 520 150 495 195" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="525" y="145" width="46" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="548" y="159" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">define</text>

    <!-- Ideação -> Diretrizes (segue) -->
    <path d="M 290 115 Q 380 130 420 195" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="345" y="130" width="44" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="367" y="144" font-size="11" fill="#64748b" text-anchor="middle">segue</text>

    <!-- Desenvolvimento -> Diretrizes (segue) -->
    <path d="M 445 350 Q 465 290 460 255" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="460" y="295" width="44" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="482" y="309" font-size="11" fill="#64748b" text-anchor="middle">segue</text>

    <!-- Desenvolvimento -> Novo Escopo (pode usar) -->
    <path d="M 330 365 Q 240 330 205 265" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="235" y="315" width="62" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="266" y="329" font-size="11" fill="#64748b" text-anchor="middle">pode usar</text>

    <!-- Desenvolvimento -> Código (cria) -->
    <path d="M 470 435 Q 490 475 520 485" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="475" y="455" width="38" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="494" y="469" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">cria</text>

    <!-- ================= ARTEFATOS (LABELS CLICÁVEIS) ================= -->
    <!-- Novo Escopo -->
    <a href="#novo-escopo" target="_blank" style="cursor: pointer;">
        <g filter="url(#shadow)">
            <rect x="110" y="220" width="140" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
            <text x="180" y="246" font-size="13" fill="#92400e" font-weight="bold" text-anchor="middle">📋 Novo Escopo</text>
        </g>
    </a>

    <!-- Diretrizes e Regras -->
    <a href="#diretrizes" target="_blank" style="cursor: pointer;">
        <g filter="url(#shadow)">
            <rect x="360" y="200" width="200" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
            <text x="460" y="222" font-size="13" fill="#92400e" font-weight="bold" text-anchor="middle">📄 Diretrizes e Regras</text>
            <text x="460" y="238" font-size="12" fill="#92400e" text-anchor="middle">de Produto</text>
        </g>
    </a>

    <!-- Código e Especificações -->
    <a href="#codigo" target="_blank" style="cursor: pointer;">
        <g filter="url(#shadow)">
            <rect x="525" y="470" width="180" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
            <text x="615" y="497" font-size="13" fill="#92400e" font-weight="bold" text-anchor="middle">💻 Código e Espec.</text>
        </g>
    </a>

    <!-- ================= CONCEITOS (ELIPSES CLICÁVEIS) ================= -->
    <!-- Ideação (Topo Esquerda) -->
    <a href="#ideacao" target="_blank" style="cursor: pointer;">
        <g filter="url(#shadow)">
            <ellipse cx="200" cy="90" rx="100" ry="42" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
            <text x="200" y="96" font-size="17" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Ideação</text>
        </g>
    </a>

    <!-- Governança de Produto (Topo Direita) -->
    <a href="#governanca" target="_blank" style="cursor: pointer;">
        <g filter="url(#shadow)">
            <ellipse cx="650" cy="90" rx="125" ry="42" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
            <text x="650" y="86" font-size="15" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Governança</text>
            <text x="650" y="104" font-size="15" fill="#1e3a8a" font-weight="bold" text-anchor="middle">de Produto</text>
        </g>
    </a>

    <!-- Desenvolvimento (Embaixo Centro) -->
    <a href="#desenvolvimento" target="_top" style="cursor: pointer;">
        <g filter="url(#shadow)">
            <ellipse cx="425" cy="390" rx="140" ry="48" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
            <text x="425" y="396" font-size="17" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Desenvolvimento</text>
        </g>
    </a>
</svg>